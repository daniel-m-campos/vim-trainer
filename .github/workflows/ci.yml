name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Neovim, uv and Node pins live in .github/actions/setup/action.yml.
  PLAYWRIGHT_BROWSERS_PATH: "0"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Neovim, uv, Node, source cache, uv sync, npm ci, Playwright Chromium.
      - uses: ./.github/actions/setup

      - name: Unit tests (content, model, app + TS model mirror, typecheck)
        run: make test

      - name: Content build matches the committed build/
        run: make content-check

      - name: End-to-end (Playwright, Chromium)
        run: make e2e

      - name: Upload e2e failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: app/e2e-failure-*.png
          if-no-files-found: ignore
