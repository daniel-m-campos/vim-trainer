name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NVIM_VERSION: v0.12.5
  # sha256 of nvim-linux-x86_64.tar.gz from the GitHub release above.
  NVIM_SHA256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
  PLAYWRIGHT_BROWSERS_PATH: "0"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (pinned release)
        run: |
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          rm nvim.tar.gz
      - run: nvim --version | head -1

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Every pinned clone (content/.cache/<source name>); the key changes with any pin.
      - name: Cache pinned content sources
        uses: actions/cache@v4
        with:
          path: content/.cache/exercism-*
          key: content-sources-${{ hashFiles('content/sources.toml') }}

      - name: Install Python and Node dependencies
        run: |
          (cd content && uv sync)
          (cd model && uv sync)
          (cd app && npm ci)
      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Unit tests (content, model, app + TS model mirror, typecheck)
        run: make test

      - name: Content build matches the committed build/
        run: make content-check

      - name: End-to-end (Playwright, Chromium)
        run: make e2e

      - name: Upload e2e failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: app/e2e-failure-*.png
          if-no-files-found: ignore
