[project]
name = "vimtrainer-model"
version = "0.1.0"
description = "vim-trainer adaptive model (Python mirror of app/src/model/model.ts), simulators and shared test vectors"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vimtrainer_model"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests", "vimtrainer_model"]
addopts = "--doctest-modules"
